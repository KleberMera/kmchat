<p-sidebar-layout class="min-h-screen bg-surface-50 text-color dark:bg-surface-950">
  @if (isMobile() && navOpen()) {
    <p-sidebar-backdrop />
  }

  <p-sidebar
    id="main-navigation"
    side="left"
    [collapsible]="isMobile() ? 'offcanvas' : 'icon'"
    [overlay]="isMobile()"
    [(open)]="navOpen"
    width="15rem"
  >
    <p-sidebar-spacer />
    <p-sidebar-aside>
      <p-sidebar-panel>
        <p-sidebar-header class="pt-4">
          <p-sidebar-menu>
            <p-sidebar-menu-item>
              <button pSidebarMenuButton class="mt-1 p-0!">
                @if (!isMobile() && !navOpen()) {
                  <span class="mx-auto grid size-12 shrink-0 place-items-center overflow-hidden rounded-lg">
                    <img
                      src="km-logo.svg"
                      alt="KM Chat"
                      class="size-12 max-w-none object-contain"
                    />
                  </span>
                } @else {
                  <img
                    src="km-chat-logo.svg"
                    alt="KM Chat"
                    class="ml-2 mr-auto h-9 w-auto max-w-full object-contain"
                  />
                }
              </button>
            </p-sidebar-menu-item>
          </p-sidebar-menu>
        </p-sidebar-header>
        <p-sidebar-content>
          <p-sidebar-group>
            <p-sidebar-group-label>MENÚ</p-sidebar-group-label>
            <p-sidebar-group-content>
              <p-sidebar-menu>
                @for (item of menuItems; track item.label) {
                  <p-sidebar-menu-item>
                    <a
                      pSidebarMenuButton
                      [routerLink]="item.path"
                      routerLinkActive
                      #activeLink="routerLinkActive"
                      [routerLinkActiveOptions]="{ exact: true }"
                      [isActive]="activeLink.isActive"
                      [attr.aria-current]="activeLink.isActive ? 'page' : null"
                      (click)="closeNavigationOnMobile()"
                    >
                      <ng-container [ngComponentOutlet]="item.icon" />
                      <span>{{ item.label }}</span>
                    </a>
                  </p-sidebar-menu-item>
                }
              </p-sidebar-menu>
            </p-sidebar-group-content>
          </p-sidebar-group>
        </p-sidebar-content>
      </p-sidebar-panel>
    </p-sidebar-aside>
  </p-sidebar>

  <p-sidebar-main>
    <header class="flex h-16 items-center gap-3 border-b border-surface-200 bg-surface-0 px-4 sm:px-6 dark:border-surface-800 dark:bg-surface-900">
      <button
        pButton
        pSidebarTrigger
        target="main-navigation"
        severity="secondary"
        text
        size="small"
        aria-label="Mostrar u ocultar menú"
      >
        <svg data-p-icon="sidebar"></svg>
      </button>
      <span class="flex-1 text-sm font-semibold">{{ activeItem().label }}</span>
      
      <span
        class="grid size-8 place-items-center rounded-full bg-primary-50 text-sm font-semibold text-primary-700 dark:bg-primary-900 dark:text-primary-100"
        aria-label="Usuario"
      >U</span>
    </header>

    <router-outlet (activate)="updateActiveItem()" />
  </p-sidebar-main>
</p-sidebar-layout>
