<main
  class="grid min-h-screen place-items-center bg-gradient-to-br from-primary-50 via-surface-50 to-surface-100 p-6 dark:from-surface-950 dark:via-surface-900 dark:to-surface-950"
>
  <section
    class="w-full max-w-md rounded-2xl border border-surface-200 bg-surface-0 p-7 shadow-xl dark:border-surface-700 dark:bg-surface-900 sm:p-10"
    aria-labelledby="login-title"
  >
    <img src="km-chat-logo.svg" alt="KM Chat" class="h-20 w-auto object-contain object-left" />
    <h1 id="login-title" class="m-0 text-3xl font-bold tracking-tight text-color">Bienvenido</h1>
    <p class="mb-7 mt-2 text-color-secondary">Ingresa tus datos para continuar al panel.</p>

    <form class="grid gap-3" [formGroup]="loginForm" (ngSubmit)="login()" novalidate>
      <label for="username" class="mt-1 text-sm font-semibold text-color">Usuario</label>
      <input
        id="username"
        name="username"
        type="text"
        formControlName="username"
        autocomplete="username"
        placeholder="Tu usuario"
        class="min-h-12 w-full rounded-lg border border-surface-300 bg-surface-0 px-3 text-color outline-none placeholder:text-muted-color autofill:bg-surface-0 autofill:text-color focus-visible:border-primary focus-visible:ring-4 focus-visible:ring-primary-100 dark:border-surface-600 dark:bg-surface-800 dark:autofill:bg-surface-800"
      />

      <label for="password" class="mt-1 text-sm font-semibold text-color">Contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        placeholder="Tu contraseña"
        class="min-h-12 w-full rounded-lg border border-surface-300 bg-surface-0 px-3 text-color outline-none placeholder:text-muted-color autofill:bg-surface-0 autofill:text-color focus-visible:border-primary focus-visible:ring-4 focus-visible:ring-primary-100 dark:border-surface-600 dark:bg-surface-800 dark:autofill:bg-surface-800"
      />

      <button
        class="mt-3 min-h-12 rounded-lg bg-primary px-4 font-semibold text-primary-contrast transition-colors hover:bg-primary-emphasis focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:cursor-not-allowed disabled:opacity-70"
        type="submit"
        [disabled]="isSubmitting()"
      >
        @if (isSubmitting()) {
          Ingresando...
        } @else {
          Ingresar
        }
      </button>
    </form>
  </section>
</main>
